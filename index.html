<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="facebook-domain-verification" content="v4fatztkiz3g57ba7kzedot89rjdsc" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DAISY | 관심사로 연결되는 동네 친구</title>
<meta name="description" content="가까운 동네에서 부담 없이 시작하는 일상 대화. 로그인 없이 채팅으로 문의하세요." />
<meta property="og:image" content="/ad.jpg" />

<style>
:root{
  --bg0:#0e1f1a;
  --bg2:#163a2d;
  --text:rgba(255,255,255,.95);
  --muted:rgba(255,255,255,.75);
  --shadow:0 18px 70px rgba(0,0,0,.38);
  --radius:24px;
  --accent:#f6d86b;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:system-ui,-apple-system;
  color:var(--text);
  background:linear-gradient(140deg,var(--bg0),var(--bg2));
}
.wrap{max-width:1120px;margin:auto;padding:26px;}
.card{
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.08);
  border-radius:var(--radius);
  backdrop-filter:blur(12px);
}
.top{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;
}
.brand{display:flex;gap:14px;align-items:center;cursor:pointer;}
.mark{width:64px;height:64px;border-radius:22px;overflow:hidden;}
.mark img{width:100%;height:100%;object-fit:cover;}

.hero{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:14px;
}
.heroLeft{padding:26px;}
h1{font-size:46px;margin:0 0 12px;line-height:1.05;}
.lead{color:var(--muted);margin-bottom:16px;line-height:1.6;}
.points{margin:0 0 18px;padding-left:18px;color:var(--muted);}
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn{
  padding:14px 18px;
  border-radius:16px;
  font-weight:900;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);
  color:var(--text);
}
.btn.primary{
  background:linear-gradient(135deg,#f6d86b,#f2c94c);
  color:#222;
  border:none;
  box-shadow:0 16px 50px rgba(246,216,107,.25);
}

.micro{
  margin-top:12px;
  font-size:13px;
  color:rgba(255,255,255,.8);
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

/* 이미지 영역 그대로 유지 */
.heroRight{
  position:relative;
  min-height:460px;
  overflow:hidden;
}
.heroImg{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:60% center;
}
.heroOverlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.55));
}
.heroCaption{
  position:absolute;
  left:14px;right:14px;bottom:14px;
  background:rgba(0,0,0,.35);
  border-radius:18px;
  padding:14px;
  font-size:14px;
}

/* guide 유지 */
.guide{
  position:absolute;
  right:14px;
  bottom:140px;
  padding:10px 14px;
  border-radius:999px;
  background:rgba(0,0,0,.35);
  cursor:pointer;
  font-size:13px;
}

.sectionTitle{
  margin:26px 0 12px;
  font-size:15px;
  color:rgba(255,255,255,.86);
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.tile{
  padding:16px;
  background:rgba(255,255,255,.07);
  border-radius:18px;
  font-size:14px;
}
footer{
  margin-top:26px;
  font-size:12px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
}

@media(max-width:920px){
  .hero{grid-template-columns:1fr;}
  .heroRight{min-height:360px;}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
  <div class="brand" onclick="guideChat()">
    <div class="mark"><img src="/logo.png"></div>
    <div>
      <strong>DAISY</strong><br>
      <small>관심사로 연결되는 동네 친구</small>
    </div>
  </div>
</div>

<div class="hero">
  <section class="card heroLeft">
    <h1>오늘, 동네 친구<br/>어때요?</h1>

    <p class="lead">
      산책, 카페, 가벼운 대화.<br/>
      가까운 곳에서 부담 없이 시작해보세요.
    </p>

    <ul class="points">
      <li><b>관심사 중심</b>으로 연결</li>
      <li><b>대화부터</b> 편하게 시작</li>
    </ul>

    <div class="actions">
      <button class="btn primary" onclick="guideChat()">지금 채팅으로 문의하기</button>
    </div>

    <div class="micro">
      <span>💬 오른쪽 아래 로고에서 시작</span>
      <span>⏱️ 로그인 없이 바로 연결</span>
    </div>
  </section>

  <aside class="card heroRight">
    <img class="heroImg" src="/ad.jpg">
    <div class="heroOverlay"></div>
    <div class="guide" onclick="guideChat()">↘ 채팅 시작</div>
    <div class="heroCaption">
      가까운 곳에서 편하게 시작하는 일상 대화.
    </div>
  </aside>
</div>

<div class="sectionTitle">이런 분께 잘 맞아요</div>
<div class="grid3">
  <div class="tile">퇴근 후 가볍게 만날 사람을 찾는 분</div>
  <div class="tile">새로운 동네에서 친구가 필요한 분</div>
  <div class="tile">취미·관심사로 자연스럽게 연결되고 싶은 분</div>
</div>

<footer>
  <div>© DAISY</div>
  <div>개인정보처리방침 · 이용약관</div>
</footer>

</div>

</body>
</html>
