  <meta property="og:image" content="/ad.jpg" />

<style>
:root{
  --bg0:#f8fbf9;
  --bg1:#eef6f2;

  --text:#24322d;
  --muted:#5f746c;

  --card:#ffffff;
  --cardSoft:#f4f8f6;

  --shadow:0 20px 60px rgba(0,0,0,.06);
  --radius:22px;

  --accent:#f6d86b;
  --accentSoft:#fff4c7;
  --border:#e3eee9;
}

*{box-sizing:border-box;}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:linear-gradient(180deg,var(--bg0),var(--bg1));
  color:var(--text);
}

.wrap{max-width:1120px;margin:0 auto;padding:26px;}

.top{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:18px;gap:14px;
}

.brand{display:flex;align-items:center;gap:14px;cursor:pointer;}
.mark{
  width:64px;height:64px;border-radius:20px;
  background:#fff;border:1px solid var(--border);
  box-shadow:var(--shadow);overflow:hidden;
}
.mark img{width:100%;height:100%;object-fit:cover;}

.brandText .name{font-weight:900;}
.brandText .tag{font-size:13px;color:var(--muted);}

.chipRow{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  padding:8px 12px;border-radius:999px;
  background:var(--cardSoft);
  border:1px solid var(--border);
  font-size:12px;color:var(--muted);
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.hero{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  gap:14px;
}

.heroLeft{padding:28px;}
h1{font-size:44px;margin:0 0 12px;}
.lead{color:var(--muted);line-height:1.6;margin-bottom:16px;}

.points{color:var(--muted);padding-left:18px;margin-bottom:18px;}

.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn{
  padding:12px 16px;border-radius:16px;
  border:1px solid var(--border);
  background:var(--cardSoft);
  font-weight:700;cursor:pointer;
}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),#f9e78a);
  border:none;color:#3a3216;
  box-shadow:0 10px 30px rgba(246,216,107,.35);
}

.heroRight{
  position:relative;min-height:460px;overflow:hidden;
}
.heroImg{
  width:100%;height:100%;
  object-fit:cover;
  object-position:60% center;
}
.heroOverlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.35));
}

.sectionTitle{margin:24px 0 12px;color:#3c5148;font-weight:700;}

.grid3{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
}
.tile{
  background:var(--cardSoft);
  border:1px solid var(--border);
  border-radius:16px;padding:14px;
}
.tile p{color:var(--muted);font-size:14px;}

.two{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;
}
.panel{padding:18px;}
.panel p{color:var(--muted);}

.step{
  background:var(--cardSoft);
  border:1px solid var(--border);
  border-radius:14px;padding:10px;margin-bottom:8px;
}

.callout{
  background:#f7fbf9;
  border:1px dashed var(--border);
  border-radius:14px;padding:12px;
  color:var(--muted);
}

footer{
  margin-top:24px;font-size:12px;color:var(--muted);
  display:flex;justify-content:space-between;flex-wrap:wrap;
}

@media(max-width:920px){
  .hero{grid-template-columns:1fr;}
  h1{font-size:36px;}
  .grid3{grid-template-columns:1fr;}
  .two{grid-template-columns:1fr;}
  .btn.primary{width:100%;}
}
</style>
</head>

<body>
<div class="wrap">

<div class="top">
  <div class="brand">
    <div class="mark">
      <img src="/logo.png" alt="DAISY">
    </div>
    <div class="brandText">
      <div class="name">DAISY</div>
      <div class="tag">관심사로 연결되는 동네 친구</div>
    </div>
  </div>

  <div class="chipRow">
    <div class="chip">로그인 없이 시작</div>
    <div class="chip">관심사 기반 연결</div>
    <div class="chip">가까운 동네 중심</div>
  </div>
</div>

<div class="hero">
  <section class="card heroLeft">
    <h1>오늘, 동네 친구<br>어때요?</h1>
    <p class="lead">
      부담 없이 가볍게 시작해보세요.<br>
      관심사로 자연스럽게 연결됩니다.
    </p>

    <ul class="points">
      <li>일상 대화 중심</li>
      <li>취향 기반 연결</li>
      <li>30초면 시작 가능</li>
    </ul>

    <div class="actions">
      <button class="btn primary">지금 시작하기</button>
      <button class="btn">관심사 보기</button>
    </div>
  </section>

  <aside class="card heroRight">
    <img class="heroImg" src="/ad.jpg" alt="DAISY 이미지">
    <div class="heroOverlay"></div>
  </aside>
</div>

<div class="sectionTitle">데이지는 이런 분께 잘 맞아요</div>
<div class="grid3">
  <div class="tile">
    <b>퇴근 후 가볍게</b>
    <p>산책, 카페, 맥주처럼 부담 없는 만남부터.</p>
  </div>
  <div class="tile">
    <b>새로운 동네 생활</b>
    <p>이사 후 친구가 필요할 때.</p>
  </div>
  <div class="tile">
    <b>취향으로 연결</b>
    <p>관심사부터 시작하니 자연스러워요.</p>
  </div>
</div>

<footer>
  <div>
    <a href="/privacy.html">개인정보처리방침</a> ·
    <a href="/terms.html">이용약관</a>
  </div>
  <div>© DAISY</div>
</footer>

</div>
</body>
</html>
